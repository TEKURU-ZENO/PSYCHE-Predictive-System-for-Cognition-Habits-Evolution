name: Psych-AI CI/CD Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Test & Preflight Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Deterministic Unit Tests
        working-directory: ./backend
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Production Preflight Diagnostic Suite
        run: |
          python scripts/preflight_check.py

  frontend-checks:
    name: Frontend TypeScript & Lint Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install NPM Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: TypeScript Compile Verification
        working-directory: ./frontend
        run: npx tsc --noEmit

  docker-compose-validate:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
