version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: psychai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psychai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psychai123}
      POSTGRES_DB: ${POSTGRES_DB:-psychai_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-psychai} -d ${POSTGRES_DB:-psychai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: psychai_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-psychai}:${POSTGRES_PASSWORD:-psychai123}@postgres:5432/${POSTGRES_DB:-psychai_db}
      SECRET_KEY: ${SECRET_KEY:-psych_ai_production_super_secret_jwt_key_32bytes}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: psychai_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: psychai_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@psychai.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    profiles:
      - tools

volumes:
  pgdata:
